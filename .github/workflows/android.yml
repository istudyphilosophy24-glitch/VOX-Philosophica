name: Build VOX 0.5 Import and Kokoro Repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/RELEASE_TRIGGER.txt', '.github/workflows/android.yml']
  pull_request:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run Android reader, import and PDF extraction regressions
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle :app:testDebugUnitTest --no-daemon --stacktrace; then
            find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -type f \
              -exec sh -c 'echo "==== TEST DETAILS: $1 ===="; head -c 25000 "$1"; echo' _ '{}' \;
            exit 1
          fi
      - name: Download and verify bundled neural models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2' \
            -o app/src/main/assets/kokoro-v1_0.tar.bz2
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2' \
            -o app/src/main/assets/kokoro-v1_1.tar.bz2
          echo "4c3052abaa60943a341f193888cf6abd68787dae6ab8ae5c925a706caa247e4e  app/src/main/assets/kokoro-v1_0.tar.bz2" | sha256sum -c -
          echo "a1e94694776049035c4f2c6529f003aaece993c76aae9a78995831c3c4dcafc6  app/src/main/assets/kokoro-v1_1.tar.bz2" | sha256sum -c -
          tar -tjf app/src/main/assets/kokoro-v1_0.tar.bz2 | grep -m 1 'model.int8.onnx' || true
          tar -tjf app/src/main/assets/kokoro-v1_1.tar.bz2 | grep -m 1 'model.int8.onnx' || true
          du -h app/src/main/assets/*
      - name: Confirm both Kokoro models synthesize real audio
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir --break-system-packages 'sherpa-onnx==1.13.8'
          mkdir -p "$RUNNER_TEMP/vox-models"
          tar -xjf app/src/main/assets/kokoro-v1_0.tar.bz2 -C "$RUNNER_TEMP/vox-models"
          tar -xjf app/src/main/assets/kokoro-v1_1.tar.bz2 -C "$RUNNER_TEMP/vox-models"
          python3 ci/kokoro_smoke.py "$RUNNER_TEMP/vox-models"
      - name: Build integrated Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK contains both Kokoro archives
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -x 'assets/kokoro-v1_0.tar.bz2'
          unzip -Z1 "$APK" | grep -x 'assets/kokoro-v1_1.tar.bz2'
          unzip -Z1 "$APK" | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          ls -lh "$APK"
      - name: Upload single-file Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VOX-PHILOSOPHICA-v0.5.0-REPAIRS-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
