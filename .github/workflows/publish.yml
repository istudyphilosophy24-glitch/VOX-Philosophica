name: Publish VOX PHILOSOPHICA Android source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.source/**'
      - '.github/workflows/publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/vox-source.tar.xz
          echo "df594d5e2946ab7cb2656d4c46a3fcf0f8c7dce3778e90efbd6f45974d734c9f  /tmp/vox-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/vox-source.tar.xz -C .
          test -f app/src/main/AndroidManifest.xml
          test -f .github/workflows/android.yml
      - name: Publish unpacked Android project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md BUILD_STATUS.txt .gitignore build.gradle.kts settings.gradle.kts gradle.properties app tests .github/workflows/android.yml
          if git diff --cached --quiet; then
            echo "Source already published"
          else
            git commit -m "Publish native Android source and APK build workflow"
            git push
          fi
